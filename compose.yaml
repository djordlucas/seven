# Development and local runs. See docs/docker.md.
#
#   docker compose run --rm dev            shell in the toolchain, repo at /app
#   docker compose run --rm seven          the root agent, interactive
#   docker compose up -d seven-serve       every agent, in the background
#
# All of seven's data lives in ./workspace, mounted at /workspace.
#
# Both read .env when it exists.

services:
  dev:
    build:
      context: .
      target: dev
    image: seven:dev
    working_dir: /app
    volumes:
      - .:/app
      # The container's own node_modules: the host's is built for the host
      # platform (esbuild ships a native binary per OS and CPU).
      - dev-node-modules:/app/node_modules
      - ./workspace:/workspace
    env_file:
      - path: .env
        required: false
    stdin_open: true
    tty: true

  seven:
    build:
      context: .
      target: runtime
    image: seven:latest
    volumes:
      - ./workspace:/workspace
    env_file:
      - path: .env
        required: false
    stdin_open: true
    tty: true

  seven-serve:
    image: seven:latest
    command: ["serve"]
    volumes:
      - ./workspace:/workspace
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    profiles: ["serve"]

volumes:
  dev-node-modules:
